
name: Cricket Intelligence Project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade six kaggle

      - name: Create Data Folder
        run: mkdir -p data

      - name: Download Cricket Dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download \
            -d patrickb1912/ipl-complete-dataset-20082020 \
            -p data \
            --unzip

      - name: Check Downloaded Files
        run: |
          ls -lh data
          test -f data/matches.csv
          test -f data/deliveries.csv

      - name: Run Cricket Project
        run: python src/run_project.py
